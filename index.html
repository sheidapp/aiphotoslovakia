<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Photo Lab – interactive demo</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 24px;
      background: #181b20;
      font-family: Arial, sans-serif;
    }
    .device {
      position: relative;
      width: min(100%, 375px);
      overflow: hidden;
      background: #0e1116;
      box-shadow: 0 16px 48px rgb(0 0 0 / 45%);
    }
    .screen { display: none; position: relative; width: 100%; }
    .screen.is-active { display: block; }
    .screen img { display: block; width: 100%; height: auto; user-select: none; }
    .tap {
      position: absolute;
      display: block;
      border: 0;
      background: transparent;
      cursor: pointer;
      border-radius: 8px;
      -webkit-tap-highlight-color: transparent;
    }
    .tap:focus-visible { outline: 3px solid #ffe72c; outline-offset: 2px; }
    .cta { left: 6%; top: 59%; width: 88%; height: 8%; }
    .back { left: 1%; top: 1.65%; width: 12%; height: 2.4%; border-radius: 50%; }
    .footer-terms { left: 18%; top: 90%; width: 38%; height: 2.5%; }
    .footer-help { left: 62%; top: 90%; width: 20%; height: 2.5%; }
    .footer-privacy { left: 15%; top: 93%; width: 70%; height: 2.5%; }
    #landing .footer-terms { top: 89.2%; }
    #landing .footer-help { top: 89.2%; }
    #landing .footer-privacy { top: 92.5%; }
    #home .footer-terms { top: 94.4%; }
    #home .footer-help { top: 94.4%; }
    #home .footer-privacy { top: 96.5%; }
    #terms .footer-terms, #privacy .footer-terms { top: 94.5%; }
    #terms .footer-help, #privacy .footer-help { top: 94.5%; }
    #terms .footer-privacy, #privacy .footer-privacy { top: 96.4%; }
    #help .footer-terms { top: 92.8%; }
    #help .footer-help { top: 92.8%; }
    #help .footer-privacy { top: 95.5%; }
    @media (max-width: 440px) {
      body { display: block; padding: 0; background: #0e1116; }
      .device { width: 100%; max-width: none; min-height: 100vh; box-shadow: none; }
    }
  </style>
</head>
<body>
  <main class="device" aria-label="AI Photo Lab interactive prototype">
    <section class="screen is-active" id="landing" aria-label="Landing page">
      <img src="assets/landing.png" alt="AI Photo Lab landing page" />
      <button class="tap cta" data-go="home" aria-label="Predplaťte sa"></button>
      <button class="tap footer-terms" data-go="terms" aria-label="Podmienky používania"></button>
      <button class="tap footer-help" data-go="help" aria-label="Pomoc"></button>
      <button class="tap footer-privacy" data-go="privacy" aria-label="Zásady ochrany osobných údajov"></button>
    </section>

    <section class="screen" id="home" aria-label="Home page">
      <img src="assets/home.png" alt="AI Photo Lab home page" />
      <button class="tap footer-terms" data-go="terms" aria-label="Podmienky používania"></button>
      <button class="tap footer-help" data-go="help" aria-label="Pomoc"></button>
      <button class="tap footer-privacy" data-go="privacy" aria-label="Zásady ochrany osobných údajov"></button>
    </section>

    <section class="screen" id="terms" aria-label="Terms of use">
      <img src="assets/terms.png" alt="Podmienky používania" />
      <button class="tap back" data-go="landing" aria-label="Späť na landing page"></button>
      <button class="tap footer-terms" data-go="terms" aria-label="Podmienky používania"></button>
      <button class="tap footer-help" data-go="help" aria-label="Pomoc"></button>
      <button class="tap footer-privacy" data-go="privacy" aria-label="Zásady ochrany osobných údajov"></button>
    </section>

    <section class="screen" id="help" aria-label="Help">
      <img src="assets/help.png" alt="Pomoc" />
      <button class="tap back" data-go="landing" aria-label="Späť na landing page"></button>
      <button class="tap footer-terms" data-go="terms" aria-label="Podmienky používania"></button>
      <button class="tap footer-help" data-go="help" aria-label="Pomoc"></button>
      <button class="tap footer-privacy" data-go="privacy" aria-label="Zásady ochrany osobných údajov"></button>
    </section>

    <section class="screen" id="privacy" aria-label="Privacy policy">
      <img src="assets/privacy.png" alt="Zásady ochrany osobných údajov" />
      <button class="tap back" data-go="landing" aria-label="Späť na landing page"></button>
      <button class="tap footer-terms" data-go="terms" aria-label="Podmienky používania"></button>
      <button class="tap footer-help" data-go="help" aria-label="Pomoc"></button>
      <button class="tap footer-privacy" data-go="privacy" aria-label="Zásady ochrany osobných údajov"></button>
    </section>
  </main>
  <script>
    const screens = [...document.querySelectorAll('.screen')];
    function show(id, addHistory = true) {
      screens.forEach(screen => screen.classList.toggle('is-active', screen.id === id));
      if (addHistory) history.pushState({ screen: id }, '', `#${id}`);
      window.scrollTo({ top: 0, behavior: 'instant' });
    }
    document.addEventListener('click', event => {
      const target = event.target.closest('[data-go]');
      if (target) show(target.dataset.go);
    });
    window.addEventListener('popstate', () => show(location.hash.slice(1) || 'landing', false));
    const initial = location.hash.slice(1);
    if (screens.some(screen => screen.id === initial)) show(initial, false);
  </script>
</body>
</html>
