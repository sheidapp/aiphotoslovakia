<html lang="sk">
  <head>

    <title>AI Photo Lab</title>
    <style>

      .page { position: relative; width: min(100%, 375px); margin: auto; background: #0f1217; }

      .cta { left: 4.5%; top: 59.5%; width: 91%; height: 7.8%; border-radius: 11px; }
      .terms { left: 20%; top: 90%; width: 38%; height: 3%; }
      .help { left: 61%; top: 90%; width: 18%; height: 3%; }
      .privacy { left: 18%; top: 94%; width: 64%; height: 3%; }
      @media (min-width: 376px) { .page { box-shadow: 0 0 28px rgb(0 0 0 / .18); } }
    </style>
  </head>
  <body>
    <main class="page" aria-label="AI Photo Lab">
      <img src="LP.png" alt="AI Photo Lab – upravujte obrázky a videá pomocou umelej inteligencie" />
      <a class="hotspot cta" href="homepage.html" aria-label="Predplaťte sa a prejdite na domovskú stránku"></a>
      <a class="hotspot terms" href="terms.html" aria-label="Podmienky používania"></a>
      <a class="hotspot help" href="help.html" aria-label="Pomoc"></a>
      <a class="hotspot privacy" href="privacy.html" aria-label="Zásady ochrany osobných údajov"></a>
    </main>
  </body>
</html>
